name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go'))
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: sqlc generate is committed
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0 generate
          git diff --exit-code --stat
      - name: unit and SQLite tests (race)
        run: go test -race -short -count=1 ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: malaka
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: malaka_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U malaka -d malaka_test -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: go test (PostgreSQL integration)
        run: go test -count=1 -p 1 ./...
        env:
          TEST_DATABASE_URL: postgres://malaka:postgres@localhost:5432/malaka_test?sslmode=disable
